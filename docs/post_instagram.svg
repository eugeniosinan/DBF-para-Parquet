<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="postBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="hexPattern" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 45.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" 
            fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .eyebrow { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
    .hero-title { font-family: 'Inter', system-ui, sans-serif; font-size: 52px; font-weight: 900; fill: #ffffff; letter-spacing: -0.5px; }
    .hero-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #38bdf8; letter-spacing: 3px; }
    .feature-title { font-family: 'Inter', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .feature-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 400; fill: #94a3b8; }
    .badge { font-family: 'Inter', system-ui, sans-serif; font-size: 12.5px; font-weight: 700; }
    .tech-pill { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
    .author-name { font-family: 'Inter', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .author-role { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; font-weight: 400; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#postBg)" />
  <rect width="1080" height="1080" fill="url(#hexPattern)" />

  <!-- Glows -->
  <circle cx="540" cy="220" r="240" fill="#0284c7" opacity="0.14" filter="url(#glow)" />
  <circle cx="200" cy="650" r="200" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />
  <circle cx="880" cy="750" r="220" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- TOP HEADER / INSTITUTION -->
  <g transform="translate(540, 55)">
    <rect x="-275" y="-18" width="550" height="36" rx="18" fill="#0f2238" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="-242" cy="0" r="5" fill="#38bdf8" />
    <text x="8" y="4.5" text-anchor="middle" class="eyebrow">SMS RIO • CENTRO DE INTELIGÊNCIA EPIDEMIOLÓGICA</text>
  </g>

  <!-- CENTER LOGO / HEX ICON (scaled without overlapping) -->
  <g transform="translate(540, 95)">
    <g transform="scale(0.27) translate(-300, 0)">
      <polygon points="300,14 580,175.7 580,517.3 300,679 20,517.3 20,175.7"
               fill="#0b162c" stroke="url(#accentGrad)" stroke-width="22" stroke-linejoin="round" filter="url(#glow)" />
      <polygon points="300,14 580,175.7 580,517.3 300,679 20,517.3 20,175.7"
               fill="#0b162c" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round" />
      <polygon points="300,32 562,183 562,510 300,661 38,510 38,183"
               fill="none" stroke="#1e3a5f" stroke-width="3" stroke-opacity="0.7" />

      <!-- DBF box -->
      <g transform="translate(185, 260)">
        <rect x="-45" y="-50" width="90" height="100" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" />
        <rect x="-35" y="-38" width="70" height="8" rx="3" fill="#475569" />
        <rect x="-35" y="-22" width="70" height="8" rx="3" fill="#475569" />
        <rect x="-35" y="-6" width="70" height="8" rx="3" fill="#475569" />
        <rect x="-35" y="10" width="70" height="8" rx="3" fill="#475569" />
        <rect x="-35" y="26" width="40" height="8" rx="3" fill="#f59e0b" />
        <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">.DBF / .DBC</text>
      </g>

      <!-- Pulse Arrow -->
      <g transform="translate(300, 260)">
        <path d="M -55 0 L -25 0 Q -15 0 -10 -25 L -5 30 L 5 -35 L 12 18 L 18 0 L 45 0"
              fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <polygon points="45,-12 62,0 45,12" fill="#38bdf8" />
      </g>

      <!-- Parquet box -->
      <g transform="translate(415, 260)">
        <rect x="-32" y="-45" width="18" height="90" rx="5" fill="#0284c7" />
        <rect x="-8" y="-45" width="18" height="90" rx="5" fill="#38bdf8" />
        <rect x="16" y="-45" width="18" height="90" rx="5" fill="#0284c7" />
        <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">.PARQUET</text>
      </g>

      <text x="300" y="490" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="900" fill="#ffffff">DBF/DBC ➔ PARQUET</text>
      <text x="300" y="530" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" letter-spacing="3">VIGILÂNCIA EM SAÚDE</text>
    </g>
  </g>

  <!-- HERO TITLE -->
  <g transform="translate(540, 325)">
    <text x="0" y="0" text-anchor="middle" class="hero-title">DBF/DBC <tspan fill="#38bdf8">para</tspan> Parquet</text>
    <text x="0" y="35" text-anchor="middle" class="hero-sub">VIGILÂNCIA EPIDEMIOLÓGICA</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="16.5" fill="#94a3b8">Conversor nativo em Rust para bases de dados da saúde pública</text>
  </g>

  <!-- SYSTEMS PILLS (ROW) -->
  <g transform="translate(540, 440)">
    <g transform="translate(-425, 0)">
      <rect x="0" y="-15" width="75" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="37.5" y="5" text-anchor="middle" class="badge" fill="#38bdf8">SIM</text>

      <rect x="87" y="-15" width="95" height="30" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="134.5" y="5" text-anchor="middle" class="badge" fill="#ec4899">SINASC</text>

      <rect x="194" y="-15" width="125" height="30" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
      <text x="256.5" y="5" text-anchor="middle" class="badge" fill="#22c55e">SIVEP SRAG</text>

      <rect x="331" y="-15" width="110" height="30" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="386" y="5" text-anchor="middle" class="badge" fill="#10b981">SIVEP SG</text>

      <rect x="453" y="-15" width="100" height="30" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
      <text x="503" y="5" text-anchor="middle" class="badge" fill="#eab308">DENGON</text>

      <rect x="565" y="-15" width="120" height="30" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="625" y="5" text-anchor="middle" class="badge" fill="#a855f7">SINAN NET</text>

      <rect x="697" y="-15" width="150" height="30" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
      <text x="772" y="5" text-anchor="middle" class="badge" fill="#f97316">DBC DISSEMIN</text>
    </g>
  </g>

  <!-- 4 HIGHLIGHT CARDS (2x2 GRID) -->
  <g transform="translate(110, 500)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="415" height="120" rx="14" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1.5" />
      <text x="24" y="40" class="feature-title">🚀 Redução de até 90%</text>
      <text x="24" y="72" class="feature-desc">Compressão colunar Parquet ZSTD.</text>
      <text x="24" y="96" class="feature-desc">Transforme 50 MB em apenas 4 MB!</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(445, 0)">
      <rect x="0" y="0" width="415" height="120" rx="14" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1.5" />
      <text x="24" y="40" class="feature-title">⚡ Suporte Nativo a .DBC</text>
      <text x="24" y="72" class="feature-desc">Converte direto arquivos do DISSEMIN</text>
      <text x="24" y="96" class="feature-desc">sem depender de TabWin ou pacotes em R.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="415" height="120" rx="14" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1.5" />
      <text x="24" y="40" class="feature-title">📅 Padrão Saúde de Datas</text>
      <text x="24" y="72" class="feature-desc">Datas em texto são convertidas direto</text>
      <text x="24" y="96" class="feature-desc">para Date32 (AAAA-MM-DD) nativo.</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(445, 140)">
      <rect x="0" y="0" width="415" height="120" rx="14" fill="#0f1f33" stroke="#1e3a5f" stroke-width="1.5" />
      <text x="24" y="40" class="feature-title">🦆 Compatibilidade Total</text>
      <text x="24" y="72" class="feature-desc">Pronto para DuckDB, Excel (Power Query),</text>
      <text x="24" y="96" class="feature-desc">Power BI, R, Python e Polars.</text>
    </g>
  </g>

  <!-- PLATFORMS & TECH PILLS -->
  <g transform="translate(540, 815)">
    <g transform="translate(-410, 0)">
      <rect x="0" y="-14" width="145" height="28" rx="14" fill="#1e293b" />
      <text x="72.5" y="5" text-anchor="middle" class="tech-pill">🪟 Windows 10/11</text>

      <rect x="160" y="-14" width="135" height="28" rx="14" fill="#1e293b" />
      <text x="227.5" y="5" text-anchor="middle" class="tech-pill">🐧 Linux x86_64</text>

      <rect x="310" y="-14" width="145" height="28" rx="14" fill="#1e293b" />
      <text x="382.5" y="5" text-anchor="middle" class="tech-pill">📦 Sem Instalação</text>

      <rect x="470" y="-14" width="170" height="28" rx="14" fill="#1e293b" />
      <text x="555" y="5" text-anchor="middle" class="tech-pill">🔒 Conformidade LGPD</text>

      <rect x="655" y="-14" width="165" height="28" rx="14" fill="#1e293b" />
      <text x="737.5" y="5" text-anchor="middle" class="tech-pill">💻 Interface &amp; CLI</text>
    </g>
  </g>

  <!-- FOOTER: AUTHOR & GITHUB REPO -->
  <g transform="translate(110, 885)">
    <rect x="0" y="0" width="860" height="85" rx="16" fill="#0a1628" stroke="#1e3a5f" stroke-width="1.5" />
    
    <g transform="translate(30, 36)">
      <text x="0" y="0" class="author-name">Eugênio Araújo</text>
      <text x="0" y="24" class="author-role">Centro de Inteligência Epidemiológica • SMS Rio</text>
    </g>

    <g transform="translate(830, 48)">
      <text x="0" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#38bdf8">github.com/eugeniosinan/DBF-para-Parquet</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="1068" width="1080" height="12" fill="url(#accentGrad)" />
</svg>