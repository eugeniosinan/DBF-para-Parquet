<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 693" width="600" height="693">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f233f" />
      <stop offset="100%" stop-color="#06111e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Parquet Blocks Gradient -->
    <linearGradient id="parquetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Health Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; fill: #ffffff; letter-spacing: 1.5px; }
    .subtitle { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; letter-spacing: 3px; font-size: 15px; }
    .caption { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #94a3b8; font-size: 12px; letter-spacing: 1px; }
    .badge { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #f8fafc; font-weight: 700; }
  </style>

  <!-- Hexagon Outer Border & Shadow -->
  <polygon points="300,14 580,175.7 580,517.3 300,679 20,517.3 20,175.7"
           fill="url(#bgGrad)"
           stroke="url(#borderGrad)"
           stroke-width="16"
           stroke-linejoin="round" />

  <!-- Inner Subtle Hexagon Ring -->
  <polygon points="300,32 562,183 562,510 300,661 38,510 38,183"
           fill="none"
           stroke="#1e3a5f"
           stroke-width="2.5"
           stroke-opacity="0.6" />

  <!-- Background decorative grid circles -->
  <g opacity="0.15">
    <circle cx="300" cy="346" r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,6" />
    <circle cx="300" cy="346" r="210" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" />
  </g>

  <!-- TOP BRANDING: CIE • SMS RIO -->
  <g transform="translate(300, 95)">
    <rect x="-100" y="-18" width="200" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-78" cy="-4" r="4" fill="#22c55e" />
    <text x="8" y="0" text-anchor="middle" class="badge" fill="#38bdf8">CIE • SMS RIO</text>
  </g>

  <!-- CENTRAL ARTWORK -->
  <g transform="translate(300, 260)">
    <!-- Legacy DBF Icon (Left) -->
    <g transform="translate(-115, 0)">
      <rect x="-45" y="-50" width="90" height="100" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" />
      <rect x="-35" y="-38" width="70" height="8" rx="3" fill="#475569" />
      <rect x="-35" y="-22" width="70" height="8" rx="3" fill="#475569" />
      <rect x="-35" y="-6" width="70" height="8" rx="3" fill="#475569" />
      <rect x="-35" y="10" width="70" height="8" rx="3" fill="#475569" />
      <rect x="-35" y="26" width="40" height="8" rx="3" fill="#f59e0b" />
      <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">.DBF / .DBC</text>
    </g>

    <!-- Transformation Flow / Arrow with Pulse -->
    <g transform="translate(0, 0)">
      <!-- Glow path -->
      <path d="M -55 0 L -25 0 Q -15 0 -10 -25 L -5 30 L 5 -35 L 12 18 L 18 0 L 45 0"
            fill="none" stroke="url(#pulseGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
      <path d="M -55 0 L -25 0 Q -15 0 -10 -25 L -5 30 L 5 -35 L 12 18 L 18 0 L 45 0"
            fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Arrow Head -->
      <polygon points="45,-10 60,0 45,10" fill="#38bdf8" />
    </g>

    <!-- Modern Apache Parquet Columns (Right) -->
    <g transform="translate(115, 0)">
      <!-- 3 Colunar Blocks representing Parquet Snappy/ZSTD format -->
      <g transform="translate(-32, -45)">
        <rect x="0" y="0" width="18" height="90" rx="5" fill="url(#parquetGrad)" />
        <rect x="3" y="6" width="12" height="20" rx="2" fill="#ffffff" opacity="0.8" />
        <rect x="3" y="32" width="12" height="20" rx="2" fill="#ffffff" opacity="0.5" />
        <rect x="3" y="58" width="12" height="24" rx="2" fill="#ffffff" opacity="0.6" />
      </g>
      <g transform="translate(-8, -45)">
        <rect x="0" y="0" width="18" height="90" rx="5" fill="url(#parquetGrad)" />
        <rect x="3" y="6" width="12" height="35" rx="2" fill="#ffffff" opacity="0.7" />
        <rect x="3" y="46" width="12" height="36" rx="2" fill="#ffffff" opacity="0.5" />
      </g>
      <g transform="translate(16, -45)">
        <rect x="0" y="0" width="18" height="90" rx="5" fill="url(#parquetGrad)" />
        <rect x="3" y="6" width="12" height="22" rx="2" fill="#ffffff" opacity="0.6" />
        <rect x="3" y="34" width="12" height="22" rx="2" fill="#ffffff" opacity="0.8" />
        <rect x="3" y="62" width="12" height="20" rx="2" fill="#ffffff" opacity="0.4" />
      </g>
      <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">.PARQUET</text>
    </g>
  </g>

  <!-- SYSTEMS PILLS (SIM • SINASC • SIVEP • SINAN) -->
  <g transform="translate(300, 395)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="-155" y="4" text-anchor="middle" class="badge" fill="#38bdf8">SIM</text>
    <circle cx="-120" cy="0" r="2" fill="#475569" />
    <text x="-80" y="4" text-anchor="middle" class="badge" fill="#ec4899">SINASC</text>
    <circle cx="-40" cy="0" r="2" fill="#475569" />
    <text x="10" y="4" text-anchor="middle" class="badge" fill="#22c55e">SIVEP</text>
    <circle cx="60" cy="0" r="2" fill="#475569" />
    <text x="105" y="4" text-anchor="middle" class="badge" fill="#eab308">DENGON</text>
    <circle cx="150" cy="0" r="2" fill="#475569" />
    <text x="180" y="4" text-anchor="middle" class="badge" fill="#a855f7">SINAN</text>
  </g>

  <!-- MAIN TITLE: dbf-para-parquet -->
  <g transform="translate(300, 485)">
    <text x="0" y="0" text-anchor="middle" class="title" font-size="32">DBF/DBC <tspan fill="#38bdf8">➔</tspan> PARQUET</text>
    <text x="0" y="32" text-anchor="middle" class="subtitle">VIGILÂNCIA EM SAÚDE</text>
  </g>

  <!-- FOOTER BADGE / RUST & ZSTD -->
  <g transform="translate(300, 580)">
    <rect x="-130" y="-14" width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" class="caption" fill="#94a3b8">RUST • ZSTD • DUCKDB</text>
  </g>
</svg>