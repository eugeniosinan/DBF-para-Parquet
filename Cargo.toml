[package]
name = "dbf-para-parquet"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
wgpu = { version = "27", features = ["vulkan", "gles"] }
egui = "0.33"
rfd = "0.17"
arrow = { version = "60", features = ["chrono-tz"] }
arrow-schema = "60"
arrow-array = "60"
parquet = { version = "60", features = ["zstd", "snap"] }
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
zip = "9.8"
sevenz-rust2 = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
walkdir = "2"
regex = "1"
